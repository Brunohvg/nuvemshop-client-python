[project]
name = "nuvemshop-sdk"
version = "1.0.0"
description = "SDK Python profissional para a API da Nuvemshop — rate-limit safe, variant-first, production-ready."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name="Bruno Vidal", email="brunovidal@lojabibelo.com.br" },
]

dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "build>=1.2.0",
    "twine>=6.0.0",
]
